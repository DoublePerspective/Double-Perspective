<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F5F0E6"><title>Zenith &amp; Zero Cribbage</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="cards.css"><link rel="stylesheet" href="appearance/appearance.css"><link rel="stylesheet" href="collection-music.css"><link rel="stylesheet" href="cribbage.css"><script src="localization/locale-boot.js"></script><link rel="stylesheet" href="../shared/web-banner.css"></head><body data-zz-game="cribbage"><main>
<header><img id="logo" src="brand.svg" alt="" onerror="this.hidden=true"><div><h1>Zenith <em>&amp;</em> Zero</h1><p><span id="kicker">THE CRIBBAGE BOARD</span> <span id="edition"></span></p></div><button id="music-open" class="music-open" aria-label="Music settings">♫</button><button id="theme" aria-label="Toggle dark theme">◐</button></header>
<section id="menu"><div class="intro"><span class="eyebrow">A LITTLE SPACE TO UNWIND</span><h2 id="headline"></h2><p id="tagline"></p></div><button id="resume" class="cb-primary-wide" hidden></button><div class="choices"><button id="play"><span class="symbol amber">◆</span><div><b id="play-title"></b><small id="play-sub"></small></div><span>→</span></button></div><button id="card-designs" class="design-setting"><span id="card-designs-label">Card design</span> <span id="design-name">Parchment</span> <span aria-hidden="true">→</span></button><button id="rules"></button><p id="stats"></p><footer>A Double Perspective creation</footer></section>
<section id="game" hidden><nav><button id="home" type="button"></button><b id="title"></b><span id="dealer-note"></span></nav>
<div class="cb-scores"><span class="cb-me"><i class="cb-dot me"></i><b id="name-me"></b> <output id="score-me">0</output></span><span class="cb-them"><output id="score-them">0</output> <b id="name-them"></b><i class="cb-dot them"></i></span></div>
<svg id="board" class="cb-board" viewBox="0 0 360 74" role="img"></svg>
<div class="cb-opp"><div id="opp-hand" class="cb-backs"></div><span id="opp-label"></span></div>
<div class="cb-play"><div class="cb-side"><div id="starter" class="cb-slot"></div><small id="starter-label"></small></div><div class="cb-mid"><div id="pile" class="cb-pile"></div><output id="count" class="cb-count"></output></div><div class="cb-side"><div id="crib" class="cb-slot"></div><small id="crib-label"></small></div></div>
<div id="show" class="cb-show" hidden></div>
<p id="notice" role="status" aria-live="polite"></p>
<div id="action"></div>
<div id="hand" class="cb-hand"></div>
<div class="tools"><button id="hint" type="button"></button><button id="new" type="button"></button><button id="help-open" type="button"></button><button id="game-designs" type="button"></button><button id="game-music" type="button"></button></div></section>
<aside id="banner" hidden><span>Ad</span><p>Discover more quiet moments with Zenith &amp; Zero Sudoku.</p><a href="https://play.google.com/store/apps/details?id=com.doubleperspective.zenithzero.sudoku.pro">Explore</a></aside>
<dialog id="help"><h2 id="help-title"></h2><p id="help-text"></p><button class="design-done" onclick="this.closest('dialog').close()">Done</button></dialog>
<dialog id="design-dialog" aria-labelledby="design-heading"><h2 id="design-heading">A deck for your mood</h2><p>Five simple designs, made for a quieter game. Your choice is saved for every game.</p><div class="deck-options"><button class="deck-option" data-design="parchment" data-deck="parchment" aria-pressed="false"><span class="deck-sample" aria-hidden="true"><span class="mini-back"></span><span class="mini-face"><span>A ♠</span><i>♠</i></span></span><span><b>Parchment</b><small>Warm paper · amber details</small></span><span class="deck-check" aria-hidden="true">✓</span></button><button class="deck-option" data-design="sage" data-deck="sage" aria-pressed="false"><span class="deck-sample" aria-hidden="true"><span class="mini-back"></span><span class="mini-face"><span>A ♠</span><i>♠</i></span></span><span><b>Sage</b><small>Soft green · a simple leaf</small></span><span class="deck-check" aria-hidden="true">✓</span></button><button class="deck-option" data-design="linen" data-deck="linen" aria-pressed="false"><span class="deck-sample" aria-hidden="true"><span class="mini-back"></span><span class="mini-face"><span>A ♠</span><i>♠</i></span></span><span><b>Linen</b><small>Ivory cloth · delicate lines</small></span><span class="deck-check" aria-hidden="true">✓</span></button><button class="deck-option" data-design="mist" data-deck="mist" aria-pressed="false"><span class="deck-sample" aria-hidden="true"><span class="mini-back"></span><span class="mini-face"><span>A ♠</span><i>♠</i></span></span><span><b>Mist</b><small>Cool blue · quiet circles</small></span><span class="deck-check" aria-hidden="true">✓</span></button><button class="deck-option" data-design="dusk" data-deck="dusk" aria-pressed="false"><span class="deck-sample" aria-hidden="true"><span class="mini-back"></span><span class="mini-face"><span>A ♠</span><i>♠</i></span></span><span><b>Dusk</b><small>Deep plum · muted gold</small></span><span class="deck-check" aria-hidden="true">✓</span></button></div><button class="design-done" onclick="this.closest('dialog').close()">Done</button></dialog>
<audio id="bg-music" preload="none"></audio><dialog id="music-dialog" aria-labelledby="music-heading"><h2 id="music-heading">A quieter soundtrack</h2><label class="setting">Music on <input type="checkbox" id="music-enabled" role="switch"></label><label class="setting" for="music-volume">Volume <output id="music-level">25%</output></label><input id="music-volume" class="music-volume" type="range" min="0" max="100" step="1" value="25"><label class="music-label" for="music-track">Track</label><select id="music-track" class="music-select"><option value="0">First Light Particles</option><option value="1">Sunset Plains</option><option value="2">Contemplation</option><option value="3">Piano Emotional Solo 139</option><option value="4">Calm Theme</option></select><label class="music-label" for="music-mode">Playback</label><select id="music-mode" class="music-select"><option value="playlist">Play all five tracks</option><option value="repeat">Repeat selected track</option></select><p id="music-status" role="status" aria-live="polite"></p><button class="design-done" onclick="this.closest('dialog').close()">Done</button></dialog>
</main><script src="edition.js"></script><script src="i18n.js"></script><script src="engine.js"></script><script src="cribbage.js"></script><script src="music.js"></script><script src="appearance/appearance.js"></script><script src="localization/locale-ui.js"></script><script src="localization/privacy-link.js"></script><script src="../shared/web-banner.js"></script></body></html>
