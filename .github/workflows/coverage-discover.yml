name: coverage-discover
on: workflow_dispatch
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Atlas wireless geodatabase
        run: |
          sudo apt-get install -y -qq gdal-bin tippecanoe >/dev/null 2>&1 || sudo apt-get install -y -qq gdal-bin
          which tippecanoe || echo "no tippecanoe"
          curl -sL -o w.zip "https://ftp.maps.canada.ca/pub/nrcan_rncan/Geographical-maps_Carte-geographique/Wireless_Data_Network-Reseau_de_donnees_sans_fil/AtlasofCanada_Communications_AtlasduCanada.gdb.zip"
          ls -la w.zip; unzip -q w.zip; ls
          G=$(ls -d *.gdb | head -1)
          ogrinfo -ro -so "$G" | head -60
          for L in $(ogrinfo -ro -q "$G" | sed -E 's/^[0-9]+: ([^ ]+).*/\1/'); do
            echo "=== $L"; ogrinfo -ro -so "$G" "$L" | sed -n '/Feature Count/,$p' | head -30
            ogrinfo -ro -q "$G" -sql "SELECT * FROM \"$L\" LIMIT 3" -geom=NO | head -40
          done
