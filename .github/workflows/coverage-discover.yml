name: coverage-discover
on: workflow_dispatch
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect RQTT
        run: |
          sudo apt-get install -y -qq gdal-bin >/dev/null
          curl -sfL -o r.zip "https://diffusion.mern.gouv.qc.ca/diffusion/RGQ/Vectoriel/Theme/Local/RQTT/OGC(GPKG)/RQTT_GPKG.zip"
          ls -la r.zip; unzip -q r.zip; G=$(find . -name "*.gpkg" | head -1); echo $G
          ogrinfo -ro -q "$G" | head -40
          for L in $(ogrinfo -ro -q "$G" | sed -E 's/^[0-9]+: ([^ ]+).*/\1/'); do
            echo "=== $L $(ogrinfo -ro -so "$G" "$L" | grep 'Feature Count')"
            ogrinfo -ro -so "$G" "$L" | sed -n '/^Geometry Column/,$p' | head -40
          done
          echo "##### text fields with trail words"
          for L in $(ogrinfo -ro -q "$G" | sed -E 's/^[0-9]+: ([^ ]+).*/\1/'); do
            for F in $(ogrinfo -ro -so "$G" "$L" | grep -E ': String' | cut -d: -f1); do
              ogrinfo -ro -q "$G" -sql "SELECT \"$F\", COUNT(*) AS n FROM \"$L\" GROUP BY \"$F\" ORDER BY n DESC LIMIT 25" 2>/dev/null | grep -E "$F \(|n \(" | paste - - | grep -iE "motoneig|vhr|quad|sentier|hors|vtt|chemin|forest" | sed "s/^/$L.$F: /" | head -25
            done
          done
