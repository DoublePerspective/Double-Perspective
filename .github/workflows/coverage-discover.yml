name: coverage-discover
on: workflow_dispatch
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - name: CRTC mobile page links
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
          for u in https://crtc.gc.ca/eng/publications/reports/policymonitoring/mob.htm https://crtc.gc.ca/eng/publications/reports/PolicyMonitoring/cmrd.htm; do
            echo "== $u"; curl -sL -A "$UA" "$u" -o page.html -w "%{http_code}\n"
            grep -oiE 'href="[^"]+\.(kml|kmz|zip|mif|tab|gpkg|shp|csv|xlsx)"' page.html | sort -u
            grep -oiE 'href="[^"]*open\.canada\.ca[^"]*"' page.html | sort -u
          done
      - name: Open Government search
        run: |
          for q in "Wireless Data Network" "LTE coverage" "mobile coverage CRTC" "5G coverage"; do
            echo "== $q"
            curl -s "https://open.canada.ca/data/api/action/package_search?rows=8&q=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$q")" \
            | python3 -c "
          import json,sys
          for p in json.load(sys.stdin)['result']['results']:
              print('#', p['title'].get('en') if isinstance(p['title'],dict) else p['title'], '|', p.get('license_title'), '|', p.get('organization',{}).get('name'), '|', p['id'], '|', p.get('metadata_modified'))
              for r in p.get('resources',[]):
                  print('   ', r.get('format'), r.get('url'))
          "
          done
