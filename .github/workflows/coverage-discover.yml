name: coverage-discover
on: workflow_dispatch
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - name: Données Québec trail datasets
        run: |
          for q in "sentiers VHR" "sentiers motoneige" "véhicules hors route" "quad" "Adresses Québec réseau routier"; do
            echo "== $q"
            curl -s "https://www.donneesquebec.ca/recherche/api/3/action/package_search?rows=6&q=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$q")" | python3 -c "
          import json,sys
          for p in json.load(sys.stdin)['result']['results']:
              print('#', p['title'], '|', p.get('license_title'), '|', (p.get('organization') or {}).get('title'), '|', p['name'], '|', p.get('metadata_modified'))
              for r in p.get('resources',[]): print('   ', r.get('format'), r.get('name'), r.get('url'))
          "
          done
